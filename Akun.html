<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5AB9B6",
            "secondary": "#A3D4C9",
            "accent": "#F6B26B",
            "background-light": "#FAFAFA",
            "background-dark": "#1E1E1E",
            "text-light": "#1E1E1E",
            "text-dark": "#FAFAFA"
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          boxShadow: {
            '2dp': '0 2px 4px rgba(0,0,0,0.12)',
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Main Content -->
<div class="flex-1 pb-28">
<!-- TopAppBar -->
<div class="flex items-center p-4 pb-2 justify-center bg-secondary/30 dark:bg-background-dark shadow-sm">
<h2 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Akun Saya</h2>
</div>
<!-- Profile Header -->
<div class="p-4 @container bg-secondary/30 dark:bg-background-dark">
<div class="flex w-full flex-col gap-4 items-center">
<div class="relative">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full min-h-32 w-32" data-alt="User profile picture" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBQD3xbPKLcUaeoDPF6-6sSmpnXRlhxeKrNYohT8emUxL2t9tUcgH3GFrFXp_J6H_ZY6E1uUMnkit_cKa-NpJrLLWoXqNvZ6AhvKKV-0EK2rs-Tg-OhfCLKEUTuxs0AqXRcFGVfQ__VhlDPWFPDSGAPjBFKC9BERk5UZLeysvRgxxuTe-Ro0nqrfnDPQPaMpZ6TDw3Z0sP7S9A1iEMsSybgsYHERv1qf4Nm9Aq5B4WgKaGVJ1ddO2Qb8bXj0vRKi91WerQ_Nc1g8aca");'></div>
<button class="absolute bottom-0 right-0 bg-primary text-white rounded-full p-2 flex items-center justify-center shadow-md">
<span class="material-symbols-outlined" style="font-size: 20px;">edit</span>
</button>
</div>
</div>
</div>
<!-- Profile Form Card -->
<div class="p-4 -mt-8">
<div class="bg-background-light dark:bg-background-dark rounded-lg shadow-2dp p-6 space-y-6">
<!-- Nama TextField -->
<label class="flex flex-col">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Nama</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal" placeholder="Masukkan nama Anda" value="Budi Setyawan"/>
<div class="text-primary flex border-y border-r border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 items-center justify-center px-4 rounded-r-lg">
<span class="material-symbols-outlined">person</span>
</div>
</div>
</label>
<!-- Email TextField -->
<label class="flex flex-col">
<p class="text-text-light dark:text-text-dark text-base font-medium leading-normal pb-2">Email</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-text-light dark:text-text-dark focus:outline-none focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 focus:border-primary h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-4 text-base font-normal leading-normal" placeholder="emailanda@domain.com" readonly="" value="budi.setyawan@example.com"/>
<div class="text-primary flex border-y border-r border-gray-300 dark:border-gray-600 bg-background-light dark:bg-gray-800 items-center justify-center px-4 rounded-r-lg">
<span class="material-symbols-outlined">mail</span>
</div>
</div>
</label>
<!-- Plan Display -->
<div class="flex items-center gap-4 min-h-14 justify-between border-t border-gray-200 dark:border-gray-700 pt-6">
<div class="flex items-center gap-4">
<div class="text-accent flex items-center justify-center rounded-lg bg-accent/20 shrink-0 size-10">
<span class="material-symbols-outlined">workspace_premium</span>
</div>
<p class="text-text-light dark:text-text-dark text-base font-normal leading-normal flex-1 truncate">Paket Pro</p>
</div>
<div class="shrink-0">
<span class="material-symbols-outlined text-primary">arrow_forward_ios</span>
</div>
</div>
</div>
</div>
<!-- Preferences Card -->
<div class="px-4">
<div class="bg-background-light dark:bg-background-dark rounded-lg shadow-2dp p-6 space-y-4">
<!-- Language Toggle -->
<div class="flex items-center justify-between">
<label class="text-text-light dark:text-text-dark text-base font-medium" for="language-toggle">Bahasa Aplikasi (Indonesia)</label>
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300 checked:border-primary checked:right-0 checked:bg-primary" id="language-toggle" name="language-toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 dark:bg-gray-600 cursor-pointer" for="language-toggle"></label>
</div>
</div>
<!-- Watermark Toggle -->
<div class="flex items-center justify-between">
<label class="text-text-light dark:text-text-dark text-base font-medium" for="watermark-toggle">Otomatis Tambahkan Watermark</label>
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300 checked:border-primary checked:right-0 checked:bg-primary" id="watermark-toggle" name="watermark-toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 dark:bg-gray-600 cursor-pointer" for="watermark-toggle"></label>
</div>
</div>
</div>
</div>
<!-- CTA Button -->
<div class="px-4 pt-8">
<button class="w-full bg-primary text-white font-bold py-4 px-4 rounded-lg shadow-2dp hover:bg-primary/90 transition-colors duration-300">
          Simpan Perubahan
        </button>
</div>
<!-- Logout Button -->
<div class="px-4 pt-4">
<button class="w-full bg-transparent text-red-500 font-bold py-4 px-4 rounded-lg border border-red-500 hover:bg-red-500 hover:text-white transition-colors duration-300">
          Keluar
        </button>
</div>
</div>
<!-- Bottom Navigation Bar -->
<div class="fixed bottom-0 left-0 right-0 bg-background-light dark:bg-gray-800 shadow-[0_-2px_4px_rgba(0,0,0,0.1)] flex justify-around items-center h-20">
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 w-full" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-xs">Beranda</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 w-full" href="#">
<span class="material-symbols-outlined">photo_library</span>
<span class="text-xs">Perpustakaan</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 w-full -mt-8" href="#">
<div class="bg-primary text-white rounded-full p-4 shadow-lg">
<span class="material-symbols-outlined">add</span>
</div>
<span class="text-xs mt-1">Buat</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 w-full" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<span class="text-xs">Jadwal</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary w-full" href="#">
<span class="material-symbols-outlined">person</span>
<span class="text-xs font-bold">Akun</span>
</a>
</div>
</div>
<style>
    .toggle-checkbox:checked {
        right: 0;
        border-color: #5AB9B6;
    }
    .toggle-checkbox:checked + .toggle-label {
        background-color: #5AB9B6;
    }
  </style>
</body></html>
