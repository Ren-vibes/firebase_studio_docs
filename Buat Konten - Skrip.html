<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Content Assistant</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#5AB9B6",
            "secondary": "#A3D4C9",
            "accent": "#F6B26B",
            "background-light": "#FAFAFA",
            "background-dark": "#1E1E1E",
            "text-light": "#1E1E1E",
            "text-dark": "#FAFAFA"
          },
          fontFamily: {
            "display": ["Plus Jakarta Sans", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.75rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          boxShadow: {
            'md': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1)',
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-light dark:text-text-dark">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="flex-grow pb-24">
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<span class="material-symbols-outlined text-text-light dark:text-text-dark text-2xl">arrow_back</span>
<h1 class="text-text-light dark:text-text-dark text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Buat Konten</h1>
<div class="w-6"></div>
</header>
<main class="px-4 py-3 flex flex-col gap-6">
<div>
<label class="flex flex-col">
<textarea class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-text-light dark:text-text-dark focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-secondary bg-background-light dark:bg-background-dark/80 dark:border-secondary/30 min-h-48 placeholder:text-text-light/50 dark:placeholder:text-text-dark/50 p-4 text-base font-normal leading-normal shadow-md" placeholder="Tulis cerita brand Anda, deskripsi produk, atau skrip iklan di sini..."></textarea>
</label>
</div>
<div class="flex flex-col gap-4">
<h2 class="text-text-light dark:text-text-dark text-base font-bold">Pilih Suara Narator</h2>
<div class="flex flex-col gap-3" style="--radio-dot-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27%235AB9B6%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3ccircle cx=%278%27 cy=%278%27 r=%274%27/%3e%3c/svg%3e');">
<label class="flex items-center gap-4 rounded-xl border border-solid border-secondary dark:border-secondary/30 p-4 flex-row-reverse bg-white dark:bg-background-dark/80 shadow-md cursor-pointer transition-all hover:border-primary">
<input checked="" class="h-5 w-5 border-2 border-secondary dark:border-secondary/50 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0" name="voice-selection" type="radio"/>
<div class="flex grow flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal">Suara Wanita - Profesional</p></div>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-secondary dark:border-secondary/30 p-4 flex-row-reverse bg-white dark:bg-background-dark/80 shadow-md cursor-pointer transition-all hover:border-primary">
<input class="h-5 w-5 border-2 border-secondary dark:border-secondary/50 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0" name="voice-selection" type="radio"/>
<div class="flex grow flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal">Suara Pria - Ramah</p></div>
</label>
<label class="flex items-center gap-4 rounded-xl border border-solid border-secondary dark:border-secondary/30 p-4 flex-row-reverse bg-white dark:bg-background-dark/80 shadow-md cursor-pointer transition-all hover:border-primary">
<input class="h-5 w-5 border-2 border-secondary dark:border-secondary/50 bg-transparent text-transparent checked:border-primary checked:bg-[image:--radio-dot-svg] focus:outline-none focus:ring-0 focus:ring-offset-0" name="voice-selection" type="radio"/>
<div class="flex grow flex-col"><p class="text-text-light dark:text-text-dark text-sm font-medium leading-normal">Suara Anak-anak - Ceria</p></div>
</label>
</div>
</div>
<div class="flex items-center gap-4 mt-2">
<button class="flex items-center justify-center size-14 shrink-0 rounded-full bg-accent text-white shadow-md hover:bg-accent/90 transition-colors">
<span class="material-symbols-outlined text-3xl">play_arrow</span>
</button>
<div class="w-full h-2 bg-secondary/50 rounded-full overflow-hidden">
<div class="h-full bg-primary" style="width: 30%;"></div>
</div>
</div>
</main>
</div>
<footer class="fixed bottom-0 left-0 right-0 z-10">
<div class="px-4 pb-4 pt-2 bg-background-light dark:bg-background-dark">
<button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 flex-1 w-full bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] shadow-md hover:bg-primary/90 transition-colors">
<span class="truncate">Simpan Skrip</span>
</button>
</div>
<div class="flex gap-2 border-t border-secondary/50 bg-background-light dark:bg-background-dark/80 dark:border-secondary/30 px-4 pb-3 pt-2 backdrop-blur-sm">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-text-light/60 dark:text-text-dark/60" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Beranda</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-text-light/60 dark:text-text-dark/60" href="#">
<span class="material-symbols-outlined">book</span>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Perpustakaan</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-text-light/60 dark:text-text-dark/60" href="#">
<span class="material-symbols-outlined">calendar_today</span>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Jadwal</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary dark:text-primary" href="#">
<span class="material-symbols-outlined font-bold">add_box</span>
<p class="text-xs font-bold leading-normal tracking-[0.015em]">Buat</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-text-light/60 dark:text-text-dark/60" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Akun</p>
</a>
</div>
</footer>
</div>
</body></html>
